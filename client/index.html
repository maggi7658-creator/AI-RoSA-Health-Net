<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFE600" />
    <meta name="description" content="AI-RoSA Health-Net: Multilingual, offline-first healthcare Progressive Web App designed for rural and senior healthcare access." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>AI-RoSA Health-Net | Accessible Healthcare PWA</title>
  </head>
  <body class="bg-brutal-canvas text-brutal-black min-h-screen selection:bg-brutal-yellow selection:text-black font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[AI-RoSA] PWA SW registered successfully:', reg.scope))
            .catch(err => console.log('[AI-RoSA] PWA SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
